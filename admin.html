<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪梨短剧 · 管理后台</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  body{background:#0b0b10;color:#f0d9e6;font-family:-apple-system,"PingFang SC",sans-serif;padding:16px;}
  h1{color:#ff5fa2;font-size:20px;margin-bottom:6px;}
  .sub{color:#8a7a83;font-size:12px;margin-bottom:18px;}
  .card{background:#16161d;border:1px solid #23232e;border-radius:14px;padding:16px;margin-bottom:16px;}
  .card h2{font-size:15px;color:#ffe3f0;margin-bottom:12px;}
  label{display:block;font-size:12px;color:#b99fae;margin:10px 0 4px;}
  input,select,textarea{width:100%;background:#1b1b24;border:1px solid #2c2c38;border-radius:10px;padding:10px 12px;color:#ffe3f0;font-size:13px;outline:0;}
  textarea{min-height:60px;resize:vertical;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .btn{display:block;width:100%;background:linear-gradient(135deg,#ff4d94,#ff7ab8);color:#fff;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:14px;}
  .btn.sec{background:#1b1b24;color:#ff9ec7;border:1px solid #2c2c38;}
  .btn.del{background:#2a0d0d;color:#ff6b6b;border:1px solid #5a1b1b;}
  .err{color:#ff6b6b;font-size:12px;min-height:16px;margin-top:6px;}
  .ok{color:#55efc4;font-size:12px;min-height:16px;margin-top:6px;}
  .eprow{display:flex;gap:8px;margin-bottom:8px;}
  .eprow input.epT{width:90px;flex:0 0 auto;}
  .eprow .rm{flex:0 0 auto;width:40px;background:#2a0d0d;color:#ff6b6b;border:1px solid #5a1b1b;border-radius:10px;cursor:pointer;}
  #loginBox{max-width:400px;margin:60px auto;}
  #mainBox{max-width:560px;margin:0 auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  td,th{padding:8px 6px;border-bottom:1px solid #23232e;text-align:left;color:#d8c8d4;}
  th{color:#b99fae;}
  .toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;font-size:13px;padding:10px 20px;border-radius:16px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;}
</style>
</head>
<body>

<!-- 登录框 -->
<div class="card" id="loginBox">
  <h1>雪梨短剧 · 管理后台</h1>
  <div class="sub" id="loginTip">首次使用请设置管理密码</div>
  <div id="oldPwdRow">
    <label>旧密码（首次设置留空）</label>
    <input id="oldPwd" type="password" placeholder="留空">
  </div>
  <label>管理密码（至少 6 位）</label>
  <input id="newPwd" type="password" placeholder="设置你的管理密码">
  <div class="err" id="loginErr"></div>
  <button class="btn" id="loginBtn">进入后台</button>
</div>

<!-- 主界面 -->
<div id="mainBox" style="display:none;">
  <h1>雪梨短剧 · 管理后台</h1>
  <div class="sub" id="helloSub"></div>

  <div class="card">
    <h2>📺 上架 / 更新短剧</h2>
    <label>剧 ID（英文，唯一，如 s3）</label>
    <input id="fShowId" type="text" placeholder="s3">
    <label>剧名</label>
    <input id="fTitle" type="text" placeholder="剧名">
    <div class="row">
      <div>
        <label>分类</label>
        <select id="fTag">
          <option>都市</option><option>人妻</option><option>师生</option>
          <option>职场</option><option>古装</option><option>家庭</option>
        </select>
      </div>
      <div>
        <label>热度（如 1.2万）</label>
        <input id="fHeat" type="text" placeholder="1.2万">
      </div>
    </div>
    <label>封面图 URL（可留空）</label>
    <input id="fThumb" type="text" placeholder="https://...">
    <label>描述（显示在剧名下方）</label>
    <textarea id="fDesc" placeholder="一句话简介…"></textarea>
    <div class="row">
      <div><label>热门推荐</label><select id="fHot"><option value="false">否</option><option value="true">是</option></select></div>
      <div><label>VIP 专享</label><select id="fVip"><option value="false">否</option><option value="true">是</option></select></div>
    </div>
    <label>剧集（标题 + 视频直链）</label>
    <div id="epRows"></div>
    <button class="btn sec" id="addEp">+ 加一集</button>
    <div class="err" id="saveErr"></div>
    <button class="btn" id="saveBtn">保存上架</button>
  </div>

  <div class="card">
    <h2>🗑 已上架片单（点击下架）</h2>
    <div id="showList">加载中…</div>
  </div>

  <div class="card">
    <h2>👥 注册用户</h2>
    <div id="userList">加载中…</div>
  </div>

  <div class="card">
    <h2>🔑 修改管理密码</h2>
    <label>旧密码</label><input id="chgOld" type="password">
    <label>新密码</label><input id="chgNew" type="password">
    <div class="ok" id="chgOk"></div>
    <button class="btn sec" id="chgBtn">修改密码</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL = 'https://vadupigcwjnbqldgquzs.supabase.co';
var SB_KEY = 'sb_publishable_yBP4oDIehDKhCKoeeuobkg_QOaaXu1D';

function sbFetch(path, opts) {
  opts = opts || {};
  var headers = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'};
  return fetch(SB_URL + path, {method: opts.method || (opts.body ? 'POST' : 'GET'), headers: headers, body: opts.body})
    .then(function(r){ return r.text().then(function(t){ var d=null; try{d=t?JSON.parse(t):null;}catch(e){}
      if(!r.ok){ throw new Error((d&&d.message)||('HTTP '+r.status)); } return d; });});
}
function sbRpc(fn, params){ return sbFetch('/rest/v1/rpc/'+fn, {body: JSON.stringify(params||{})}); }
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hashPwd(p){var s='xueli#admin#salt#'+p;var h1=0x811c9dc5>>>0,h2=0x9e3779b9>>>0;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=Math.imul(h2+c,2654435761)>>>0;}return h1.toString(16)+h2.toString(16);}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';},1500);}

var adminPwd = sessionStorage.getItem('admin_pwd') || '';

/* 登录：首次=设密码；之后=验密码 */
document.getElementById('loginBtn').addEventListener('click', function(){
  var op = document.getElementById('oldPwd').value;
  var np = document.getElementById('newPwd').value;
  var err = document.getElementById('loginErr');
  err.textContent = '';
  if(np.length < 6){ err.textContent = '密码至少 6 位'; return; }
  sbRpc('fn_admin_setpwd', {p_old: op || '', p_new: np}).then(function(rows){
    var r = rows && rows[0];
    if(!r || !r.ok){ err.textContent = r ? r.msg : '设置失败'; return; }
    adminPwd = np;
    sessionStorage.setItem('admin_pwd', np);
    enterMain();
  }).catch(function(e){ err.textContent = e.message || '失败'; });
});

function enterMain(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainBox').style.display = 'block';
  document.getElementById('helloSub').textContent = '已登录 · ' + new Date().toLocaleString();
  addEpRow(); addEpRow();
  loadShows(); loadUsers();
}

/* 集数行 */
function addEpRow(t, u){
  var box = document.getElementById('epRows');
  var div = document.createElement('div');
  div.className = 'eprow';
  div.innerHTML = '<input class="epT" type="text" placeholder="第N集" value="'+(t||'')+'">'+
                  '<input type="text" placeholder="视频直链 https://..." value="'+(u||'')+'">'+
                  '<button class="rm">×</button>';
  div.querySelector('.rm').addEventListener('click', function(){ div.remove(); });
  box.appendChild(div);
}
document.getElementById('addEp').addEventListener('click', function(){ addEpRow(); });

/* 保存上架 */
document.getElementById('saveBtn').addEventListener('click', function(){
  var err = document.getElementById('saveErr');
  err.textContent = '';
  var sid = document.getElementById('fShowId').value.trim();
  var title = document.getElementById('fTitle').value.trim();
  if(!/^[a-zA-Z0-9_-]{1,20}$/.test(sid)){ err.textContent = '剧 ID 需英文/数字'; return; }
  if(!title){ err.textContent = '剧名必填'; return; }
  var eps = [];
  document.querySelectorAll('#epRows .eprow').forEach(function(row){
    var t = row.querySelector('.epT').value.trim();
    var u = row.querySelector('input[type="text"]:not(.epT)').value.trim();
    if(t && u) eps.push({title:t, url:u});
  });
  if(!eps.length){ err.textContent = '至少添加一集（标题+链接）'; return; }
  var payload = {
    show_id: sid, title: title,
    tag: document.getElementById('fTag').value,
    thumb: document.getElementById('fThumb').value.trim(),
    heat: document.getElementById('fHeat').value.trim(),
    desc: document.getElementById('fDesc').value.trim(),
    hot: document.getElementById('fHot').value === 'true',
    vip: document.getElementById('fVip').value === 'true',
    episodes: eps
  };
  var btn = document.getElementById('saveBtn');
  btn.textContent = '保存中…';
  sbRpc('fn_admin_save_show', {p_pwd: adminPwd, p_show: payload}).then(function(rows){
    var r = rows && rows[0];
    btn.textContent = '保存上架';
    if(!r || !r.ok){ err.textContent = r ? r.msg : '保存失败'; return; }
    showToast('✅ 上架成功：' + title);
    err.textContent = '';
    loadShows();
  }).catch(function(e){ btn.textContent = '保存上架'; err.textContent = e.message || '保存失败'; });
});

/* 片单列表 */
function loadShows(){
  var el = document.getElementById('showList');
  sbFetch('/rest/v1/site_shows?select=show_id,title,tag&enabled=eq.true&order=created_at.desc').then(function(rows){
    if(!rows || !rows.length){ el.innerHTML = '<div style="color:#5a5a6a;font-size:12px;">暂无上架剧集</div>'; return; }
    var h = '<table><tr><th>ID</th><th>剧名</th><th>分类</th><th></th></tr>';
    rows.forEach(function(r){
      h += '<tr><td>'+esc(r.show_id)+'</td><td>'+esc(r.title)+'</td><td>'+esc(r.tag)+'</td>'+
           '<td><button class="btn del" data-did="'+esc(r.show_id)+'" style="padding:5px 12px;font-size:11px;margin:0;">下架</button></td></tr>';
    });
    h += '</table>';
    el.innerHTML = h;
    el.querySelectorAll('.del').forEach(function(b){
      b.addEventListener('click', function(){
        if(!confirm('确认下架 ' + b.dataset.did + ' ？')) return;
        sbRpc('fn_admin_del_show', {p_pwd: adminPwd, p_show_id: b.dataset.did}).then(function(rows){
          showToast(rows && rows[0] && rows[0].ok ? '已下架' : (rows&&rows[0]?rows[0].msg:'失败'));
          loadShows();
        });
      });
    });
  }).catch(function(){ el.innerHTML = '<div style="color:#ff6b6b;font-size:12px;">加载失败</div>'; });
}

/* 用户列表 */
function loadUsers(){
  var el = document.getElementById('userList');
  sbFetch('/rest/v1/app_users?select=username,uid,coins,vip,created_at&order=created_at.desc&limit=100').then(function(rows){
    if(!rows || !rows.length){ el.innerHTML = '<div style="color:#5a5a6a;font-size:12px;">暂无注册用户</div>'; return; }
    var h = '<table><tr><th>用户</th><th>ID</th><th>金币</th><th>VIP</th></tr>';
    rows.forEach(function(r){
      h += '<tr><td>'+esc(r.username)+'</td><td>'+esc(r.uid||'')+'</td><td>'+(r.coins||0)+'</td><td>'+(r.vip?'是':'否')+'</td></tr>';
    });
    h += '</table>';
    el.innerHTML = h;
  }).catch(function(){ el.innerHTML = '<div style="color:#ff6b6b;font-size:12px;">加载失败</div>'; });
}

/* 改密码 */
document.getElementById('chgBtn').addEventListener('click', function(){
  var o = document.getElementById('chgOld').value, n = document.getElementById('chgNew').value;
  if(n.length < 6){ showToast('新密码至少 6 位'); return; }
  sbRpc('fn_admin_setpwd', {p_old: o, p_new: n}).then(function(rows){
    var r = rows && rows[0];
    if(r && r.ok){ document.getElementById('chgOk').textContent = '✅ 密码已修改'; adminPwd = n; sessionStorage.setItem('admin_pwd', n); }
    else showToast(r ? r.msg : '修改失败');
  });
});

/* 判断是否已设过密码：尝试用任意密码验证，返回'旧密码错误'说明已设置 */
sbRpc('fn_admin_setpwd', {p_old: '', p_new: '____probe____'}).then(function(rows){
  var r = rows && rows[0];
  if(r && r.ok){
    /* 首次：已把 ____probe____ 设成了密码——自动重新设为空流程由用户完成 */
    document.getElementById('loginTip').textContent = '首次使用，请设置管理密码';
    document.getElementById('oldPwdRow').style.display = 'none';
  } else {
    document.getElementById('loginTip').textContent = '已设置密码，请输入进入';
    document.getElementById('oldPwdRow').style.display = 'block';
  }
}).catch(function(){
  document.getElementById('loginTip').textContent = '首次使用，请设置管理密码';
  document.getElementById('oldPwdRow').style.display = 'none';
});
</script>
</body>
</html>
