<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪梨短剧 · 管理后台</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  body{background:#0b0b10;color:#f0d9e6;font-family:-apple-system,"PingFang SC",sans-serif;padding:14px 14px 40px;}
  h1{color:#ff5fa2;font-size:19px;margin-bottom:4px;}
  .sub{color:#8a7a83;font-size:12px;margin-bottom:16px;}
  .card{background:#16161d;border:1px solid #23232e;border-radius:14px;padding:14px;margin-bottom:14px;}
  .card h2{font-size:14px;color:#ffe3f0;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .card h2 span.tog{font-size:11px;color:#ff9ec7;font-weight:normal;}
  label{display:block;font-size:11px;color:#b99fae;margin:9px 0 4px;}
  input,select,textarea{width:100%;background:#1b1b24;border:1px solid #2c2c38;border-radius:10px;padding:9px 11px;color:#ffe3f0;font-size:13px;outline:0;}
  textarea{min-height:54px;resize:vertical;}
  .row{display:flex;gap:8px;}
  .row>*{flex:1;}
  .btn{display:block;width:100%;background:linear-gradient(135deg,#ff4d94,#ff7ab8);color:#fff;border:0;border-radius:11px;padding:12px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:12px;}
  .btn.sec{background:#1b1b24;color:#ff9ec7;border:1px solid #2c2c38;margin-top:0;}
  .btn.del{background:#2a0d0d;color:#ff6b6b;border:1px solid #5a1b1b;margin-top:0;}
  .btn.mini{display:inline-block;width:auto;padding:6px 12px;font-size:11px;margin:0 4px 0 0;border-radius:9px;}
  .err{color:#ff6b6b;font-size:12px;min-height:15px;margin-top:6px;}
  .ok{color:#55efc4;font-size:12px;min-height:15px;margin-top:6px;}
  .eprow{display:flex;gap:7px;margin-bottom:7px;}
  .eprow input.epT{width:78px;flex:0 0 auto;}
  .eprow .rm{flex:0 0 auto;width:38px;background:#2a0d0d;color:#ff6b6b;border:1px solid #5a1b1b;border-radius:9px;cursor:pointer;}
  #loginBox{max-width:400px;margin:60px auto;}
  #mainBox{max-width:580px;margin:0 auto;}
  .show{background:#12121a;border:1px solid #23232e;border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .showhead{display:flex;gap:10px;align-items:center;padding:10px;cursor:pointer;}
  .showhead img{width:44px;height:60px;object-fit:cover;border-radius:7px;background:#23232e;flex:0 0 auto;}
  .showhead .info{flex:1;min-width:0;}
  .showhead .st{font-size:13px;font-weight:bold;color:#ffe3f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .showhead .sm{font-size:11px;color:#8a7a83;margin-top:3px;}
  .showhead .arrow{color:#8a7a83;font-size:12px;flex:0 0 auto;}
  .epsbox{display:none;border-top:1px solid #23232e;padding:10px;}
  .epsbox.open{display:block;}
  .epitem{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #1c1c26;font-size:12px;}
  .epitem:last-child{border-bottom:0;}
  .epitem .epn{flex:1;color:#d8c8d4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .epitem .dl{flex:0 0 auto;background:#2a0d0d;color:#ff6b6b;border:1px solid #5a1b1b;border-radius:8px;padding:4px 9px;font-size:10px;cursor:pointer;}
  .addep{margin-top:8px;background:#1b1b24;color:#ff9ec7;border:1px dashed #3a2a35;border-radius:9px;padding:9px;text-align:center;font-size:12px;cursor:pointer;}
  .urow{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #1c1c26;font-size:12px;}
  .urow .un{flex:1;color:#ffe3f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .urow .uc{color:#ffd699;font-weight:bold;flex:0 0 auto;}
  .urow .ub{background:#1b1b24;color:#fff;border:1px solid #2c2c38;border-radius:8px;padding:4px 9px;font-size:11px;cursor:pointer;}
  .toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;font-size:13px;padding:10px 18px;border-radius:16px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center;}
  .hint{font-size:11px;color:#6a5a65;margin-top:6px;line-height:1.5;}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal.show{display:flex;}
  .modalbox{background:#16161d;border:1px solid #2c2c38;border-radius:16px;padding:20px;width:100%;max-width:340px;}
  .modalmsg{color:#ffe3f0;font-size:14px;line-height:1.6;margin-bottom:14px;}
  .modalbox input{width:100%;background:#1b1b24;border:1px solid #2c2c38;border-radius:10px;padding:10px 12px;color:#ffe3f0;font-size:14px;outline:0;margin-bottom:14px;}
  .modalbtns{display:flex;gap:10px;}
  .modalbtns button{flex:1;border:0;border-radius:10px;padding:11px;font-size:14px;font-weight:bold;cursor:pointer;}
  .mok{background:linear-gradient(135deg,#ff4d94,#ff7ab8);color:#fff;}
  .mcancel{background:#1b1b24;color:#b99fae;border:1px solid #2c2c38;}
</style>
</head>
<body>

<div class="card" id="loginBox">
  <h1>雪梨短剧 · 管理后台</h1>
  <div class="sub">请输入管理密码</div>
  <label>管理密码</label>
  <input id="loginPwd" type="password" placeholder="输入管理密码">
  <div class="err" id="loginErr"></div>
  <button class="btn" id="loginBtn">登录</button>
</div>

<div id="mainBox" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <h1>雪梨短剧 · 管理后台</h1>
    <button id="logoutBtn" style="background:#2a0d0d;color:#ff6b6b;border:1px solid #5a1b1b;border-radius:9px;padding:6px 12px;font-size:11px;cursor:pointer;">退出登录</button>
  </div>
  <div class="sub" id="helloSub"></div>

  <div class="card">
    <h2>🎬 影视库 <span class="tog" id="libCount"></span></h2>
    <div id="showList" class="hint">加载中…</div>
  </div>

  <div class="card">
    <h2>➕ 上架新剧 <span class="tog" id="formTog">展开 ▾</span></h2>
    <div id="formBody" style="display:none;">
      <label>剧 ID（英文，如 s4；与 R2 文件夹同名）</label>
      <input id="fShowId" type="text" placeholder="s4">
      <label>剧名</label>
      <input id="fTitle" type="text" placeholder="剧名">
      <div class="row">
        <div><label>分类</label>
          <select id="fTag"><option>都市</option><option>人妻</option><option>师生</option><option>职场</option><option>古装</option><option>家庭</option></select>
        </div>
        <div><label>热度</label><input id="fHeat" type="text" placeholder="1.2万"></div>
      </div>
      <label>封面图 URL（可留空）</label>
      <input id="fThumb" type="text" placeholder="https://...">
      <label>描述（显示在剧名下方）</label>
      <textarea id="fDesc" placeholder="一句话简介…"></textarea>
      <div class="row">
        <div><label>热门推荐</label><select id="fHot"><option value="false">否</option><option value="true">是</option></select></div>
        <div><label>VIP 专享</label><select id="fVip"><option value="false">否</option><option value="true">是</option></select></div>
      </div>
      <label>解锁金币数（0 = 免费；填数字则该剧只能试看 30 秒）</label>
      <input id="fCoin" type="number" placeholder="0" value="0">
      <label>剧集（标题 + 视频直链）</label>
      <div id="epRows"></div>
      <button class="btn sec" id="addEp" style="margin-top:8px;">+ 加一集</button>
      <div class="err" id="saveErr"></div>
      <button class="btn" id="saveBtn">保存上架</button>
      <div class="hint">同一剧 ID 再保存 = 覆盖该剧全部集数；单独加集请用影视库里的「+ 加集」。</div>
    </div>
  </div>

  <div class="card">
    <h2>📥 批量导入 <span class="tog" id="batchTog">展开 ▾</span></h2>
    <div id="batchBody" style="display:none;">
      <div class="hint" style="color:#b99fae;margin-bottom:8px;">每行一部剧，用竖线 | 分隔：<br>
      剧ID|剧名|分类|封面URL|描述|金币价|第1集链接|第2集链接|第3集链接…<br>
      例子：<br>
      <code style="color:#ff9ec7;font-size:10px;">s4|新剧名|人妻||简介文字|50|https://.../01.mp4|https://.../02.mp4</code><br>
      集数不写标题时自动命名「第1集、第2集…」；封面/描述/金币价可留空。</div>
      <textarea id="batchText" placeholder="s4|剧名|人妻|https://封面.png|简介|50|https://...01.mp4|https://...02.mp4" style="min-height:140px;"></textarea>
      <div class="ok" id="batchOk"></div>
      <button class="btn" id="batchRun">开始导入</button>
    </div>
  </div>

  <div class="card">
    <h2>👥 用户与金币 <span class="tog" id="userCount"></span></h2>
    <div class="row" style="margin-bottom:10px;">
      <input id="coinUser" type="text" placeholder="用户名">
      <input id="coinNum" type="number" placeholder="金币数" style="max-width:90px;">
    </div>
    <div class="row">
      <button class="btn sec" id="coinAdd">+ 加金币</button>
      <button class="btn sec" id="coinSub">- 扣金币</button>
      <button class="btn sec" id="coinSet">设为该值</button>
    </div>
    <div class="ok" id="coinOk"></div>
    <div id="userList" class="hint" style="margin-top:10px;">加载中…</div>
  </div>

  <div class="card">
    <h2>🔑 修改管理密码</h2>
    <label>旧密码</label><input id="chgOld" type="password">
    <label>新密码</label><input id="chgNew" type="password">
    <div class="ok" id="chgOk"></div>
    <button class="btn sec" id="chgBtn" style="margin-top:10px;">修改密码</button>
  </div>
</div>


<div class="modal" id="uiModal">
  <div class="modalbox">
    <div class="modalmsg" id="uiMsg"></div>
    <input id="uiInput" type="text" style="display:none;">
    <div class="modalbtns">
      <button class="mcancel" id="uiCancel">取消</button>
      <button class="mok" id="uiOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL = 'https://vadupigcwjnbqldgquzs.supabase.co';
var SB_KEY = 'sb_publishable_yBP4oDIehDKhCKoeeuobkg_QOaaXu1D';

function sbFetch(path, opts) {
  opts = opts || {};
  var headers = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'};
  return fetch(SB_URL + path, {method: opts.method || (opts.body ? 'POST' : 'GET'), headers: headers, body: opts.body})
    .then(function(r){ return r.text().then(function(t){ var d=null; try{d=t?JSON.parse(t):null;}catch(e){}
      if(!r.ok){ throw new Error((d&&d.message)||('HTTP '+r.status)); } return d; });});
}
function sbRpc(fn, params){ return sbFetch('/rest/v1/rpc/'+fn, {body: JSON.stringify(params||{})}); }
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';},1600);}
function q(id){return document.getElementById(id);}

/* ===== 自绘弹窗（替代原生 confirm/prompt，WebView 也能用） ===== */
var _uiCb = null, _uiMode = 'confirm';
function uiConfirm(msg, cb){
  _uiMode = 'confirm'; _uiCb = cb;
  q('uiMsg').textContent = msg;
  q('uiInput').style.display = 'none';
  q('uiModal').classList.add('show');
}
function uiPrompt(msg, defVal, cb){
  _uiMode = 'prompt'; _uiCb = cb;
  q('uiMsg').textContent = msg;
  var inp = q('uiInput');
  inp.style.display = 'block';
  inp.value = defVal == null ? '' : String(defVal);
  q('uiModal').classList.add('show');
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 80);
}
function uiClose(){
  q('uiModal').classList.remove('show');
  _uiCb = null;
}
q('uiOk').addEventListener('click', function(){
  var cb = _uiCb, mode = _uiMode, val = q('uiInput').value;
  q('uiModal').classList.remove('show');
  _uiCb = null;
  if(!cb) return;
  if(mode === 'prompt') cb(val); else cb(true);
});
q('uiCancel').addEventListener('click', function(){
  var cb = _uiCb, mode = _uiMode;
  q('uiModal').classList.remove('show');
  _uiCb = null;
  if(!cb) return;
  if(mode === 'prompt') cb(null); else cb(false);
});
q('uiModal').addEventListener('click', function(e){ if(e.target === this) uiClose(); });

var adminPwd = '';
try{ adminPwd = localStorage.getItem('admin_pwd') || ''; }catch(e){}
var openShowId = null;

q('loginBtn').addEventListener('click', function(){
  var pwd = q('loginPwd').value;
  var err = q('loginErr');
  err.textContent = '';
  if(!pwd){ err.textContent = '请输入管理密码'; return; }
  var btn = q('loginBtn');
  btn.textContent = '校验中…';
  sbRpc('fn_admin_login', {p_pwd: pwd}).then(function(r){
    btn.textContent = '登录';
    if(r === true){
      adminPwd = pwd;
      try{ localStorage.setItem('admin_pwd', pwd); }catch(e){}
      enterMain();
    } else { err.textContent = '密码错误'; }
  }).catch(function(e){ btn.textContent = '登录'; err.textContent = e.message || '登录失败'; });
});

function enterMain(){
  q('loginBox').style.display = 'none';
  q('mainBox').style.display = 'block';
  q('helloSub').textContent = '已登录 · ' + new Date().toLocaleString();
  if(!q('epRows').children.length){ addEpRow(); addEpRow(); }
  loadShows(); loadUsers();
}

q('batchTog').addEventListener('click', function(){
  var b = q('batchBody');
  if(b.style.display === 'none'){ b.style.display = 'block'; this.textContent = '收起 ▴'; }
  else { b.style.display = 'none'; this.textContent = '展开 ▾'; }
});

q('formTog').addEventListener('click', function(){
  var b = q('formBody');
  if(b.style.display === 'none'){ b.style.display = 'block'; this.textContent = '收起 ▴'; }
  else { b.style.display = 'none'; this.textContent = '展开 ▾'; }
});
function openForm(){ q('formBody').style.display='block'; q('formTog').textContent='收起 ▴'; }

function addEpRow(t, u){
  var box = q('epRows');
  var div = document.createElement('div');
  div.className = 'eprow';
  div.innerHTML = '<input class="epT" type="text" placeholder="第N集" value="'+(t?esc(t):'')+'">'+
                  '<input type="text" placeholder="视频直链 https://..." value="'+(u?esc(u):'')+'">'+
                  '<button class="rm">×</button>';
  div.querySelector('.rm').addEventListener('click', function(){ div.remove(); });
  box.appendChild(div);
}
q('addEp').addEventListener('click', function(){ addEpRow(); });

q('saveBtn').addEventListener('click', function(){
  var err = q('saveErr');
  err.textContent = '';
  var sid = q('fShowId').value.trim();
  var title = q('fTitle').value.trim();
  if(!/^[a-zA-Z0-9_-]{1,20}$/.test(sid)){ err.textContent='剧 ID 需英文/数字'; return; }
  if(!title){ err.textContent='剧名必填'; return; }
  var eps = [];
  document.querySelectorAll('#epRows .eprow').forEach(function(row){
    var t = row.querySelector('.epT').value.trim();
    var u = row.querySelector('input[type="text"]:not(.epT)').value.trim();
    if(t && u) eps.push({title:t, url:u});
  });
  if(!eps.length){ err.textContent='至少一集（标题+链接）'; return; }
  if(!adminPwd){ err.textContent='请先登录'; return; }
  var payload = {
    show_id: sid, title: title,
    tag: q('fTag').value, thumb: q('fThumb').value.trim(),
    heat: q('fHeat').value.trim(), desc: q('fDesc').value.trim(),
    hot: q('fHot').value === 'true', vip: q('fVip').value === 'true',
    coin_price: parseInt(q('fCoin').value, 10) || 0,
    episodes: eps
  };
  var btn = q('saveBtn'); btn.textContent = '保存中…';
  sbRpc('fn_admin_save_show', {p_pwd: adminPwd, p_show: payload}).then(function(rows){
    var r = rows && rows[0];
    btn.textContent = '保存上架';
    if(!r || !r.ok){ err.textContent = r ? r.msg : '保存失败'; return; }
    showToast('✅ 已上架：' + title);
    openShowId = sid;
    loadShows();
  }).catch(function(e){ btn.textContent='保存上架'; err.textContent = e.message || '保存失败'; });
});

function loadShows(){
  var el = q('showList');
  sbFetch('/rest/v1/site_shows?select=show_id,title,tag,thumb,heat,episodes,coin_price&enabled=eq.true&order=created_at.desc').then(function(rows){
    if(!rows || !rows.length){ el.innerHTML = '<div class="hint">还没有上架剧集，点下面「上架新剧」开始</div>'; q('libCount').textContent=''; return; }
    q('libCount').textContent = rows.length + ' 部';
    var h = '';
    rows.forEach(function(r){
      var eps = r.episodes || [];
      var open = (r.show_id === openShowId);
      h += '<div class="show" data-sid="'+esc(r.show_id)+'">'+
        '<div class="showhead" data-head="'+esc(r.show_id)+'">'+
          '<img src="'+esc(r.thumb||'')+'" onerror="this.style.opacity=.15">'+
          '<div class="info"><div class="st">'+esc(r.title)+'</div>'+
          '<div class="sm">'+esc(r.tag||'')+' · 共 '+eps.length+' 集'+(r.coin_price?' · 🔒'+r.coin_price+'金币':' · 免费')+(r.heat?' · 热度'+esc(r.heat):'')+'</div></div>'+
          '<div class="arrow">'+(open?'▴':'▾')+'</div>'+
        '</div>'+
        '<div class="epsbox'+(open?' open':'')+'">';
      if(!eps.length){ h += '<div class="hint">暂无剧集</div>'; }
      eps.forEach(function(e, idx){
        h += '<div class="epitem"><div class="epn">'+esc(e.title||('第'+(idx+1)+'集'))+'</div>'+
             '<button class="dl" data-del="'+esc(r.show_id)+'" data-idx="'+idx+'">删除</button></div>';
      });
      h += '<div class="addep" data-add="'+esc(r.show_id)+'">+ 加集</div>'+
           '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">'+
           '<button class="btn sec mini" data-price="'+esc(r.show_id)+'" data-p="'+(r.coin_price||0)+'">改金币价</button>'+
           '<button class="btn sec mini" data-edit="'+esc(r.show_id)+'">编辑整部</button>'+
           '<button class="btn del mini" data-off="'+esc(r.show_id)+'">整部下架</button>'+
           '</div>'+
        '</div></div>';
    });
    el.innerHTML = h;
    bindLib();
  }).catch(function(e){ el.innerHTML = '<div class="hint" style="color:#ff6b6b">加载失败：'+(e.message||'')+'</div>'; });
}

function bindLib(){
  var el = q('showList');
  el.querySelectorAll('[data-head]').forEach(function(hd){
    hd.addEventListener('click', function(){
      var box = hd.parentNode.querySelector('.epsbox');
      var sid = hd.dataset.head;
      if(box.classList.contains('open')){ box.classList.remove('open'); openShowId = null; }
      else { box.classList.add('open'); openShowId = sid; }
      var ar = hd.querySelector('.arrow');
      if(ar) ar.textContent = box.classList.contains('open') ? '▴' : '▾';
    });
  });
  el.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var sid = b.dataset.del, idx = parseInt(b.dataset.idx, 10);
      uiConfirm('确定删除这一集？', function(ok){
        if(!ok) return;
        b.textContent = '…';
        sbRpc('fn_admin_del_ep', {p_pwd: adminPwd, p_show_id: sid, p_idx: idx}).then(function(rows){
          var r = rows && rows[0];
          showToast(r && r.ok ? '已删除该集' : (r ? r.msg : '失败'));
          openShowId = sid; loadShows();
        }).catch(function(){ showToast('删除失败'); });
      });
    });
  });
  el.querySelectorAll('[data-add]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var sid = b.dataset.add;
      uiPrompt('新集的标题（如 第4集）：', '', function(t){
        if(!t) return;
        uiPrompt('新集的视频直链：', '', function(u){
          if(!u) return;
          b.textContent = '追加中…';
          sbRpc('fn_admin_add_ep', {p_pwd: adminPwd, p_show_id: sid, p_title: t, p_url: u}).then(function(rows){
            var r = rows && rows[0];
            showToast(r && r.ok ? '✅ 已追加：'+t : (r ? r.msg : '失败'));
            openShowId = sid;
            loadShows();
          }).catch(function(){ showToast('追加失败'); });
        });
      });
    });
  });
  el.querySelectorAll('[data-price]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var sid = b.dataset.price;
      var cur = b.dataset.p || '0';
      uiPrompt('设置本剧解锁金币数（当前 ' + cur + '，填 0 = 免费）：', cur, function(v){
        if(v === null) return;
        var n = parseInt(v, 10);
        if(isNaN(n) || n < 0){ showToast('请输入非负数字'); return; }
        sbRpc('fn_admin_set_price', {p_pwd: adminPwd, p_show_id: sid, p_price: n}).then(function(rows){
          var r = rows && rows[0];
          showToast(r && r.ok ? '✅ ' + r.msg : (r ? r.msg : '失败'));
          openShowId = sid; loadShows();
        }).catch(function(){ showToast('改价失败'); });
      });
    });
  });
  el.querySelectorAll('[data-edit]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var sid = b.dataset.edit;
      sbRpc('fn_admin_get_show', {p_pwd: adminPwd, p_show_id: sid}).then(function(rows){
        var s = rows && rows[0];
        if(!s){ showToast('读取失败'); return; }
        q('fShowId').value = sid;
        q('fTitle').value = s.title || '';
        q('fTag').value = s.tag || '都市';
        q('fHeat').value = s.heat || '';
        q('fThumb').value = s.thumb || '';
        q('fDesc').value = s.desc_text || '';
        q('fHot').value = String(!!s.hot);
        q('fVip').value = String(!!s.vip);
        q('fCoin').value = (s.coin_price || 0);
        var box = q('epRows'); box.innerHTML = '';
        var eps = s.episodes || [];
        if(!eps.length){ addEpRow(); addEpRow(); }
        else eps.forEach(function(x){ addEpRow(x.title, x.url); });
        openForm();
        window.scrollTo({top:0, behavior:'smooth'});
        showToast('已载入表单，改完点保存');
      }).catch(function(){ showToast('读取失败'); });
    });
  });
  el.querySelectorAll('[data-off]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var sid = b.dataset.off;
      uiConfirm('确定整部下架？', function(ok){
        if(!ok) return;
        sbRpc('fn_admin_del_show', {p_pwd: adminPwd, p_show_id: sid}).then(function(rows){
          var r = rows && rows[0];
          showToast(r && r.ok ? '已下架' : (r ? r.msg : '失败'));
          openShowId = null; loadShows();
        }).catch(function(){ showToast('失败'); });
      });
    });
  });
}

function loadUsers(){
  var el = q('userList');
  sbRpc('fn_admin_list_users', {p_pwd: adminPwd}).then(function(rows){
    if(!rows || !rows.length){ el.innerHTML = '<div class="hint">暂无注册用户</div>'; q('userCount').textContent=''; return; }
    q('userCount').textContent = rows.length + ' 人';
    var h = '';
    rows.forEach(function(r){
      h += '<div class="urow"><div class="un">'+esc(r.username)+'</div>'+
           '<div class="uc">'+ (r.coins||0) +'币</div>'+
           (r.vip?'<div style="color:#ffd699;font-size:10px;">VIP</div>':'')+
           '<button class="ub" data-u="'+esc(r.username)+'" data-c="'+(r.coins||0)+'">改币</button>'+
           '<button class="ub" data-k="'+esc(r.username)+'">+100</button></div>';
    });
    el.innerHTML = h;
    el.querySelectorAll('[data-k]').forEach(function(b){
      b.addEventListener('click', function(){
        sbRpc('fn_admin_add_coins', {p_pwd: adminPwd, p_username: b.dataset.k, p_delta: 100}).then(function(rows){
          var r = rows && rows[0]; showToast(r && r.ok ? '已 +100' : (r?r.msg:'失败')); loadUsers();
        });
      });
    });
    el.querySelectorAll('[data-u]').forEach(function(b){
      b.addEventListener('click', function(){
        var v = b.dataset.c;
        uiPrompt('设置 ' + b.dataset.u + ' 的金币数（当前 ' + v + '）：', v, function(val){
          if(val === null) return;
          var n = parseInt(val, 10);
          if(isNaN(n) || n < 0){ showToast('请输入非负数字'); return; }
          sbRpc('fn_admin_set_coins', {p_pwd: adminPwd, p_username: b.dataset.u, p_coins: n}).then(function(rows){
            var r = rows && rows[0]; showToast(r && r.ok ? '已设为 '+n : (r?r.msg:'失败')); loadUsers();
          });
        });
      });
    });
  }).catch(function(e){ el.innerHTML = '<div class="hint" style="color:#ff6b6b">加载失败：'+(e.message||'')+'<br>请先在 Supabase 跑 fn_admin_list_users 的 SQL</div>'; });
}

function coinOp(mode){
  var u = q('coinUser').value.trim();
  var n = parseInt(q('coinNum').value, 10);
  var ok = q('coinOk');
  ok.textContent = '';
  if(!u){ ok.textContent = '请输入用户名'; return; }
  if(isNaN(n) || n < 0){ ok.textContent = '请输入非负数字'; return; }
  var fn, params;
  if(mode === 'add'){ fn='fn_admin_add_coins'; params={p_pwd:adminPwd,p_username:u,p_delta:n}; }
  else if(mode === 'sub'){ fn='fn_admin_add_coins'; params={p_pwd:adminPwd,p_username:u,p_delta:-n}; }
  else { fn='fn_admin_set_coins'; params={p_pwd:adminPwd,p_username:u,p_coins:n}; }
  sbRpc(fn, params).then(function(rows){
    var r = rows && rows[0];
    ok.textContent = r && r.ok ? ('✅ ' + r.msg) : (r ? r.msg : '失败');
    loadUsers();
  }).catch(function(e){ ok.textContent = e.message || '失败'; });
}
q('coinAdd').addEventListener('click', function(){ coinOp('add'); });
q('coinSub').addEventListener('click', function(){ coinOp('sub'); });
q('coinSet').addEventListener('click', function(){ coinOp('set'); });

q('batchRun').addEventListener('click', function(){
  var txt = q('batchText').value.trim();
  var okEl = q('batchOk');
  okEl.textContent = '';
  if(!txt){ okEl.textContent = '请先粘贴内容'; return; }
  var lines = txt.split('\n').map(function(x){ return x.trim(); }).filter(function(x){ return x.length; });
  if(!lines.length){ okEl.textContent = '没有有效行'; return; }
  var btn = q('batchRun');
  btn.textContent = '导入中 0/' + lines.length;
  var done = 0, fail = 0;
  function next(){
    if(done + fail >= lines.length){
      btn.textContent = '开始导入';
      okEl.textContent = '✅ 完成：成功 ' + done + ' 部，失败 ' + fail + ' 部';
      loadShows();
      return;
    }
    var line = lines[done + fail];
    var p = line.split('|').map(function(x){ return x.trim(); });
    var sid = p[0], title = p[1], tag = p[2] || '都市', thumb = p[3] || '', desc = p[4] || '', coin = parseInt(p[5] || '0', 10) || 0;
    var urls = p.slice(6).filter(function(u){ return u && /^https?:\/\//i.test(u); });
    if(!sid || !title || !urls.length){
      fail++; btn.textContent = '导入中 ' + (done+fail) + '/' + lines.length; next(); return;
    }
    var eps = urls.map(function(u, i){ return {title: '第' + (i+1) + '集', url: u}; });
    sbRpc('fn_admin_save_show', {p_pwd: adminPwd, p_show: {
      show_id: sid, title: title, tag: tag, thumb: thumb, desc: desc,
      coin_price: coin, hot: true, vip: false, heat: '', episodes: eps
    }}).then(function(rows){
      var r = rows && rows[0];
      if(r && r.ok) done++; else fail++;
      btn.textContent = '导入中 ' + (done+fail) + '/' + lines.length;
      next();
    }).catch(function(){
      fail++; btn.textContent = '导入中 ' + (done+fail) + '/' + lines.length; next();
    });
  }
  next();
});

q('chgBtn').addEventListener('click', function(){
  var o = q('chgOld').value, n = q('chgNew').value;
  if(n.length < 6){ showToast('新密码至少 6 位'); return; }
  sbRpc('fn_admin_setpwd', {p_old: o, p_new: n}).then(function(rows){
    var r = rows && rows[0];
    if(r && r.ok){ q('chgOk').textContent = '✅ 密码已修改'; adminPwd = n; try{localStorage.setItem('admin_pwd', n);}catch(e){} }
    else showToast(r ? r.msg : '修改失败');
  });
});

/* 退出登录：清除本机记住的密码 */
q('logoutBtn').addEventListener('click', function(){
  try{ localStorage.removeItem('admin_pwd'); }catch(e){}
  adminPwd = '';
  q('loginPwd').value = '';
  q('mainBox').style.display = 'none';
  q('loginBox').style.display = 'block';
  q('loginErr').textContent = '';
  showToast('已退出，下次需要重新输密码');
});

/* 记住过密码则自动登录（点「退出登录」可取消记住） */
if(adminPwd){
  sbRpc('fn_admin_login', {p_pwd: adminPwd}).then(function(r){
    if(r === true) enterMain();
    else { try{ localStorage.removeItem('admin_pwd'); }catch(e){} }
  }).catch(function(){});
}
</script>
